# Tizon Books · Netlify
[build]
  command = "npm run build"
  publish = "dist"

# The two Firebase web configs in App.jsx (the books, and the store read-only) are public by design (it identifies the
# project; the login and firestore.rules protect the data), so Netlify's
# secret scan is told this one value is expected.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyAOph6_Dr2ChyEi2iFF4yDT-p9jk3uDd3k,AIzaSyDiXMoYgZfMKV5vL58Viyxuztl3RI3DsB0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Loaded as a package, not bundled: it has native and dynamic parts.
  external_node_modules = ["firebase-admin"]

# A payment page's short link: /p/<business>/<page>/<key>
[[redirects]]
  from = "/p/:b/:p/:k"
  to = "/.netlify/functions/books-mail?action=pay&b=:b&p=:p&k=:k"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
